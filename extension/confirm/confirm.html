<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leash — подтверждение</title>
  <link rel="stylesheet" href="../ui.css">
  <script type="module" src="confirm.js"></script>
</head>
<body class="confirm-window">
  <h1>Claude просит разрешения</h1>
  <p id="text" class="question">Загружаю вопрос…</p>
  <p class="hint">Проверьте сайт и действие. Если вы не просили Claude об этом — отклоните.</p>
  <div class="buttons">
    <button id="deny" type="button" class="stop">Отклонить</button>
    <button id="allow" type="button">Разрешить</button>
  </div>
</body>
</html>
