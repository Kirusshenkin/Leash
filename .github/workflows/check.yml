# Те же проверки, что make check и make e2e локально (e2e — с настоящим мостом),
# плюс поиск ключей API во всей истории (хук pre-commit на свежем клоне выключен).
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUSTUP_BIN: /home/runner/.cargo/bin

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ключи API в истории
        run: |
          if git log -p --all --no-color | grep -E '^\+' | grep -qE 'sk-ant-[A-Za-z0-9_-]{20,}'; then
            echo "в истории есть строка, похожая на ключ API (sk-ant-…)"
            exit 1
          fi

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Тулчейн ставит rustup по rust-toolchain.toml. Инструменты собираются
      # из crates.io с --locked: исходники сверяются с хешами реестра.
      - name: Инструменты
        run: |
          rustup show active-toolchain || rustup toolchain install
          BINDGEN=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install --locked wasm-bindgen-cli --version "=$BINDGEN"
          cargo install --locked cargo-deny --version =0.20.2
          cargo install --locked cargo-audit --version =0.22.2
      - run: make check

  # Мост на Windows: тесты канала (TCP 127.0.0.1 с токеном), clippy и
  # регистрация в реестре. e2e с настоящим Firefox здесь не идёт: стенд на Go
  # пока только для macOS и Linux.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Тесты и clippy моста
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo test --locked --offline -p leash-host -p leash-core
          cargo clippy --locked --offline -p leash-host -p leash-core --all-targets -- -D warnings
      - name: Регистрация в Firefox через реестр
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --offline -p leash-host
          if ($LASTEXITCODE -ne 0) { throw 'сборка' }
          ./target/debug/leash-host.exe install
          if ($LASTEXITCODE -ne 0) { throw 'install' }
          $key = 'HKCU:\Software\Mozilla\NativeMessagingHosts\leash'
          $manifest = (Get-ItemProperty $key).'(default)'
          $m = Get-Content -Raw $manifest | ConvertFrom-Json
          if ($m.allowed_extensions -ne 'leash@kirusshenkin.github.io') { throw 'allowed_extensions' }
          if (-not (Test-Path $m.path)) { throw "в манифесте неверный путь: $($m.path)" }
          ./target/debug/leash-host.exe uninstall
          if ($LASTEXITCODE -ne 0) { throw 'uninstall' }
          if (Test-Path $key) { throw 'ключ реестра не удалён' }

  e2e:
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache: false
      - name: Инструменты
        run: |
          rustup show active-toolchain || rustup toolchain install
          BINDGEN=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install --locked wasm-bindgen-cli --version "=$BINDGEN"
      - name: gofmt и vet
        run: |
          test -z "$(gofmt -l e2e)" || { gofmt -l e2e; exit 1; }
          go -C e2e vet .
      # Сценарии I требуют e2e/private и настоящей модели — в CI их нет.
      - run: firefox --version && make e2e
