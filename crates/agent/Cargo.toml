[package]
name = "leash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Версии зафиксированы точно; wasm-bindgen-cli обязан совпадать с wasm-bindgen.
[dependencies]
leash-core = { path = "../core", version = "=0.1.0" }
wasm-bindgen = "=0.2.128"
js-sys = { version = "=0.3.105", default-features = false, features = ["std"] }  # без фичи unsafe-eval: js-sys не даёт привязок к eval-подобным API

[dependencies.web-sys]
version = "=0.3.105"
features = [
  "AbortController",
  "AbortSignal",
  "Crypto",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Node",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "ReadableStreamReadResult",
  "ReferrerPolicy",
  "RequestCache",
  "RequestCredentials",
  "RequestInit",
  "RequestMode",
  "RequestRedirect",
  "Response",
  "Window",
]
